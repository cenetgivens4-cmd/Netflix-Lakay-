<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Lakay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #141414;
            color: #fff;
            padding-bottom: 30px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Ekran Animasyon Ouvèti (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.8s ease 2.5s forwards;
        }
        .splash-logo {
            color: #e50914;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulseLogo 1.5s infinite;
        }
        @keyframes pulseLogo {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        header {
            background-color: #000;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px solid #e50914;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        header h1 {
            color: #e50914;
            font-size: 24px;
            letter-spacing: 1px;
            margin: 0 auto;
        }
        /* Bouton Ikon Paramèt anlè adwat */
        .settings-icon-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            position: absolute;
            right: 0;
        }

        /* Bwat Rechèch la */
        .search-box {
            width: 100%;
            padding: 10px 15px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus {
            border-color: #e50914;
        }

        .container {
            padding: 20px;
            flex-grow: 1;
        }
        h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #b3b3b3;
        }
        
        /* Grid pou fim yo */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .movie-card {
            background-color: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: scale(1.03);
        }
        .movie-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }
        .movie-info {
            padding: 8px;
            text-align: center;
        }
        .movie-title {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }
        .movie-views {
            font-size: 11px;
            color: #aaa;
        }

        /* Modal Paramèt (Settings Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .modal-content {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid #333;
        }
        .modal-content h3 {
            color: #e50914;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .modal-content p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }
        .close-modal-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Footer / Pa anba nèt */
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
            border-top: 1px solid #222;
            margin-top: 20px;
        }

        /* Ekran Lektè Videyo (Player Screen) */
        #player-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #player-screen video {
            width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            z-index: 2001;
        }
        .details-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .details-box h3 { font-size: 16px; margin-bottom: 5px; }
        .details-box p { font-size: 13px; color: #ccc; }
    </style>
</head>
<body>

    <!-- Animasyon Ouvèti App la -->
    <div id="splash-screen">
        <div class="splash-logo">Netflix Lakay</div>
    </div>

    <header>
        <div class="header-top">
            <h1>Netflix Lakay</h1>
            <!-- Ti ikon paramèt nan kwen anlè adwat -->
            <button class="settings-icon-btn" onclick="openSettings()">⚙️</button>
        </div>
        <!-- Bouton Rechèch -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Chache yon fim..." onkeyup="filterMovies()">
    </header>

    <div class="container">
        <h2>Tout Fim yo</h2>
        <div class="movies-grid" id="moviesGrid">
            <!-- Fim yo ap parèt la a otomatikman -->
        </div>
    </div>

    <!-- Fenèt Modal Paramèt ki gen tout enfòmasyon yo -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Paramèt</h3>
            <p>Si w vle ajoute yon fim sou Netflix Lakay, ekrim sou WhatsApp</p>
            <a href="https://wa.me/50942365530?text=Salitasyon%20P-52%20Art,%20mwen%20vle%20ajoute%20yon%20fim%20sou%20Netflix%20Lakay" class="whatsapp-btn" target="_blank">
                💬 Ekri m sou WhatsApp (42365530)
            </a>
            <button class="close-modal-btn" onclick="closeSettings()">Fèmen</button>
        </div>
    </div>

    <!-- Pòsyon anba nèt (Footer) -->
    <footer>
        App Créé par P-52 Art
    </footer>

    <!-- Ekran Lektè Videyo a -->
    <div id="player-screen">
        <button class="back-btn" onclick="closePlayer()">⬅ Retounen</button>
        <video id="mainVideo" controls playsinline></video>
        <div class="details-box" id="detailsBox">
            <h3 id="playerTitle"></h3>
            <p id="playerDesc"></p>
        </div>
    </div>

    <script>
        // Lis fim yo
        let movies = [
            {
                title: "Fim Kreyòl Mwen",
                poster: "https://i.postimg.cc/8kfW5cyM/20260826-061326.png",
                video: "https://archive.org/download/00365207fc-9a-66e-6f-180d-582d-7c-75d-05/00365207fc9a66e6f180d582d7c75d05.mp4",
                desc: "Men yon bèl fim pou ou."
            }
        ];

        function renderMovies(moviesToDisplay = movies) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if(moviesToDisplay.length === 0) {
                grid.innerHTML = '<p style="color: #777; font-size: 14px;">Ankenn fim pa koresponn ak rechèch ou a.</p>';
                return;
            }

            moviesToDisplay.forEach((movie, index) => {
                const originalIndex = movies.indexOf(movie);
                const views = movie.views || 0;

                grid.innerHTML += `
                    <div class="movie-card" onclick="playMovie(${originalIndex})">
                        <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/150/141414/e50914?text=Afich'">
                        <div class="movie-info">
                            <div class="movie-title">${movie.title}</div>
                            <div class="movie-views">👁️ ${views} vue${views > 1 ? 's' : ''}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterMovies() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = movies.filter(movie => movie.title.toLowerCase().includes(searchTerm));
            renderMovies(filtered);
        }

        // Fonksyon pou louvri ak fèmen fenèt paramèt la
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        const videoPlayer = document.getElementById('mainVideo');

        function playMovie(index) {
            const movie = movies[index];
            
            const viewedKey = `viewed_movie_${index}`;
            if (!sessionStorage.getItem(viewedKey)) {
                if (!movie.views) {
                    movie.views = 1;
                } else {
                    movie.views += 1;
                }
                sessionStorage.setItem(viewedKey, 'true');
            }

            document.getElementById('playerTitle').innerText = movie.title;
            document.getElementById('playerDesc').innerText = movie.desc;
            videoPlayer.src = movie.video;

            document.getElementById('player-screen').style.display = 'flex';
            videoPlayer.play();

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
            
            renderMovies();
        }

        function closePlayer() {
            videoPlayer.pause();
            videoPlayer.src = '';
            document.getElementById('player-screen').style.display = 'none';

            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }

        renderMovies();
    </script>
</body>
</html>
